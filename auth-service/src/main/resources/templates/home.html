<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Home</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;

            background: url('/images/img.png') no-repeat center center fixed;
            background-size: cover;

            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        .card {
            position: absolute;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -60%);

            background: #ffffff;
            padding: 28px 30px;
            border-radius: 14px;
            width: 420px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
            text-align: left;
            z-index: 1;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 22px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
            font-weight: 500;
        }

        .value {
            color: #111;
            font-weight: 600;
        }

        .actions {
            margin-top: 20px;
            text-align: center;
        }

        .actions button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .actions button:hover {
            background: #4338ca;
        }

        .loading {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="card">
    <h2>Logged in to User Details Micro Service</h2>

    <div id="content" class="loading">Loading...</div>

    <div class="actions">
        <button onclick="logout()">Logout</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("jwt");

    if (!token) {
        window.location.href = "/";
    } else {
        const params = new URLSearchParams(window.location.search);
        const username = params.get("username");

        if (!username) {
            document.getElementById("content").innerText = "No username provided in URL";
        } else {
            fetch("/User/home?username=" + encodeURIComponent(username), {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            })
                .then(res => {
                    if (res.status === 401) {
                        throw new Error("Unauthorized");
                    }
                    return res.json();
                })
                .then(user => {
                    const html = `
                    <div class="detail-row">
                        <span class="label">Username</span>
                        <span class="value">${user.userName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">First Name</span>
                        <span class="value">${user.firstName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Last Name</span>
                        <span class="value">${user.lastName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Email</span>
                        <span class="value">${user.email}</span>
                    </div>
                `;
                    document.getElementById("content").innerHTML = html;
                })
                .catch(err => {
                    console.error(err);
                    localStorage.removeItem("jwt");
                    window.location.href = "/";
                });
        }
    }

    function logout() {
        localStorage.removeItem("jwt");
        window.location.href = "/";
    }
</script>

</body>
</html>
