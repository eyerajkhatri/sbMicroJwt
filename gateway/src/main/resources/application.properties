spring.application.name=APIGateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

jwt.secret=${JWT_SECRET_KEY}

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/signup,/login,/,/home,/images/**

spring.cloud.gateway.server.webflux.routes[1].id=user-details-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-details-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/VerifyUser,/NewUser,/User/home



management.endpoints.web.exposure.include=health,metrics

logging.level.web=INFO

